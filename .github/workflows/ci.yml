name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Type Check, Migrate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finsignal_ci_user
          POSTGRES_PASSWORD: finsignal_ci_ephemeral_test_password
          POSTGRES_DB: finsignal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: finsignal_test
      POSTGRES_USER: finsignal_ci_user
      POSTGRES_PASSWORD: finsignal_ci_ephemeral_test_password
      APP_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Lint Check
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run mypy Type Check
        run: uv run mypy src tests

      - name: Run Alembic Migrations
        run: uv run alembic upgrade head

      - name: Run Pytest
        run: uv run pytest -v
